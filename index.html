<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon-96x96.png" />
  <title>sai ngữ pháp?👀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>công cụ sửa ngữ pháp và dịch thông minh (nhất thế giới)</h1>
    
    <div class="config">
      <input id="api-key" type="password" placeholder="nhập API key của bạn vào đây và bấm Enter" />
      <select id="model-select">
        <option value="gpt-5">OpenAI GPT-5</option>
        <option value="gpt-5-mini">OpenAI GPT-5 Mini</option>
        <option value="gpt-5-nano">OpenAI GPT-5 Nano</option>
        <option value="gpt-4.1">OpenAI GPT-4.1</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
      </select>
    </div>

    <textarea id="user-input" placeholder="🗣️muốn nói gì nói đi (bằng tiếng Anh\Pháp, nếu ngôn ngữ khác thì sẽ dịch sang Anh)"></textarea>
    <div id="status" class="status"></div>
    <div id="result" class="result"></div>
  </main>

  <footer>
      <p>
          built with the dedicated support of ChatLGPT and Germini  💀<br />
          25/12/2025 germineye
      </p>

  </footer>

  <script src="script.js"></script>
</body>
</html>
